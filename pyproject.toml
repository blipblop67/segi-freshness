[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segi-freshness"
version = "1.0.0"
description = "Edge AI freshness monitoring for wet-market produce on NVIDIA Jetson Orin Nano"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# numpy<2: JetPack 6 system OpenCV and TensorRT bindings are built against numpy 1.x.
# OpenCV and TensorRT come from JetPack on the device (GStreamer-enabled build); do not
# pip-install opencv-python on the Jetson, it would shadow the system build.
dependencies = [
  "numpy>=1.21,<2",
  "pydantic>=2.5,<3",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "prometheus-client>=0.19",
  "paho-mqtt>=2.0,<3",
]

[project.optional-dependencies]
jetson = ["cuda-python>=12.2,<13"]
dev = [
  "opencv-python-headless>=4.8,<4.11",
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
  "pybind11>=2.12",
]

[project.scripts]
segi-freshness = "segi_freshness.__main__:main"

[tool.setuptools.packages.find]
include = ["segi_freshness*"]

[tool.setuptools.package-data]
segi_freshness = ["static/*.html", "*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Header", "fastapi.Depends"]
