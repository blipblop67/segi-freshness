name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # JetPack 6 ships Python 3.10
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  cuda-build:
    # Compile-only check of the CUDA kernels for Orin (SM 8.7); no GPU needed.
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends python3-dev python3-pip cmake
      - run: pip3 install "pybind11>=2.12,<3"
      - run: cmake -S csrc -B build -DCMAKE_CUDA_ARCHITECTURES=87 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j"$(nproc)"
